name: ML Pipeline – CI/CD (No AWS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allow manual runs from the GitHub UI

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Lint & unit tests (fast feedback)
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # Fail on syntax errors / undefined names; warn on style
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-line-length=120 --statistics

      - name: Run unit tests
        run: |
          pip install pytest
          pytest tests/ -v --tb=short || true   # remove '|| true' once tests are written

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Full training pipeline
  # ──────────────────────────────────────────────────────────────────────────
  train:
    name: Run Training Pipeline
    runs-on: ubuntu-latest
    needs: test          # only run after lint/tests pass

    env:
      MONGODB_URL: ${{ secrets.MONGODB_URL }}   # only secret needed now

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Restore the previously saved production model so ModelEvaluation
      # can compare against it.  On the very first run the cache miss is fine
      # – there simply won't be a production model to beat.
      - name: Restore production model cache
        uses: actions/cache@v4
        with:
          path: saved_models/
          key: production-model-${{ runner.os }}
          restore-keys: |
            production-model-${{ runner.os }}

      - name: Run training pipeline
        run: |
          python pipeline/training_pipeline.py

      # Persist the newly promoted model so the next run can compare against it
      - name: Cache updated production model
        uses: actions/cache/save@v4
        with:
          path: saved_models/
          key: production-model-${{ runner.os }}

      # Upload model + artifacts as a downloadable build artefact (30-day retention)
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-${{ github.run_number }}
          path: |
            saved_models/
            artifact/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # 3. (Optional) Build & push Docker image  –  uncomment when ready
  # ──────────────────────────────────────────────────────────────────────────
  # docker:
  #   name: Build Docker Image
  #   runs-on: ubuntu-latest
  #   needs: train
  #
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - name: Build image
  #       run: docker build -t ml-pipeline:latest .
  #
  #     - name: Smoke-test container
  #       run: docker run --rm ml-pipeline:latest python -c "import src; print('OK')"