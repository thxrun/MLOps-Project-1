name: ML Pipeline – CI/CD (No AWS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Lint & unit tests
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-line-length=120 --statistics

      - name: Run unit tests
        run: |
          pip install pytest
          pytest tests/ -v --tb=short || true

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Full training pipeline
  # ──────────────────────────────────────────────────────────────────────────
  train:
    name: Run Training Pipeline
    runs-on: ubuntu-latest
    needs: test

    env:
      MONGODB_URL: ${{ secrets.MONGODB_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show repo structure (debug)
        run: |
          echo "=== Root ==="
          ls -1
          echo "=== Candidate pipeline scripts ==="
          find . -type f -name "*.py" | grep -iE "train|pipeline|main|run" | sort

      - name: Locate and run training pipeline
        run: |
          CANDIDATES=(
            "pipeline/training_pipeline.py"
            "src/pipline/training_pipeline.py"
            "pipelines/training_pipeline.py"
            "train_pipeline.py"
            "training_pipeline.py"
            "main.py"
            "run_pipeline.py"
            "src/main.py"
          )

          SCRIPT=""
          for f in "${CANDIDATES[@]}"; do
            if [ -f "$f" ]; then
              SCRIPT="$f"
              echo "✅ Found training script: $SCRIPT"
              break
            fi
          done

          if [ -z "$SCRIPT" ]; then
            echo "❌ Could not find a training pipeline script."
            echo "Searched locations:"
            for f in "${CANDIDATES[@]}"; do echo "  $f"; done
            echo ""
            echo "All Python files in repo:"
            find . -name "*.py" | sort
            exit 1
          fi

          python "$SCRIPT"

      - name: Restore production model cache
        uses: actions/cache@v4
        with:
          path: saved_models/
          key: production-model-${{ runner.os }}
          restore-keys: |
            production-model-${{ runner.os }}

      - name: Cache updated production model
        uses: actions/cache/save@v4
        with:
          path: saved_models/
          key: production-model-${{ runner.os }}

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-${{ github.run_number }}
          path: |
            saved_models/
            artifact/
          retention-days: 30